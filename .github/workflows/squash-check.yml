name: Enforce Squash Merge Policy

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-merge-strategy:
    runs-on: ubuntu-latest
    steps:
      - name: Check Squash Merge Policy
        run: |
          echo "✅ Squash and merge policy is enforced via repository settings"
          echo "✅ Only squash merging is allowed in this repository"
