name: Enforce Squash Merge Policy

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-merge-strategy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Enforce Squash Merge Only
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          COMMITS=$(git rev-list $BASE_SHA..$HEAD_SHA --count)
          echo "Number of commits in PR: $COMMITS"
          if [ "$COMMITS" -gt 1 ]; then
            echo "❌ PR has $COMMITS commits - FAILED!"
            exit 1
          fi
          echo "✅ PR has single commit - OK!"
